backend:
  name: github
  repo: FaveroJ/Site-vincent
  branch: main
  base_url: vincent-cms-oauth.justin-favero.workers.dev
  auth_endpoint: /auth

media_folder: assets/images
public_folder: /assets/images

collections:

  # ─── ARTISTE ───────────────────────────────────────────────────

  - name: "bandeau-artiste"
    label: "Artiste — Bandeau défilant"
    files:
      - name: "messages"
        label: "Messages du bandeau"
        file: "data/artiste-bandeau.json"
        fields:
          - label: "Messages"
            name: "items"
            widget: "list"
            fields:
              - { label: "Texte", name: "texte", widget: "string" }
              - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false }

  - name: "expositions"
    label: "Artiste — Expositions"
    files:
      - name: "liste"
        label: "Liste des expositions"
        file: "data/artiste-expositions.json"
        fields:
          - label: "Expositions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lieu", name: "lieu", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Affiche (optionnel)", name: "affiche", widget: "image", required: false }

  - name: "dessins"
    label: "Artiste — Galeries de dessins"
    files:
      - name: "liste"
        label: "Liste des galeries"
        file: "data/artiste-dessins.json"
        fields:
          - label: "Galeries"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Technique", name: "technique", widget: "string", required: false }
              - { label: "Support", name: "support", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Vignette (image principale)", name: "vignette", widget: "image" }

  - name: "sons"
    label: "Artiste — Sons"
    files:
      - name: "liste"
        label: "Liste des sons"
        file: "data/artiste-sons.json"
        fields:
          - label: "Sons"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "URL SoundCloud", name: "url", widget: "string" }

  - name: "installations"
    label: "Artiste — Installations"
    files:
      - name: "liste"
        label: "Liste des installations"
        file: "data/artiste-installations.json"
        fields:
          - label: "Installations"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lieu / Date", name: "meta", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image", required: false }

  - name: "livres"
    label: "Artiste — Livres d'artiste"
    files:
      - name: "liste"
        label: "Liste des livres"
        file: "data/artiste-livres.json"
        fields:
          - label: "Livres"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Format", name: "format", widget: "string", required: false }
              - { label: "Technique", name: "technique", widget: "string", required: false }
              - { label: "Dimensions", name: "dimensions", widget: "string", required: false }
              - { label: "Année", name: "annee", widget: "string", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Vignette", name: "vignette", widget: "image" }

  - name: "apropos-artiste"
    label: "Artiste — À propos"
    files:
      - name: "artiste"
        label: "À propos — Artiste"
        file: "data/artiste-apropos.json"
        fields:
          - { label: "Portrait", name: "portrait", widget: "image" }
          - label: "Paragraphes"
            name: "paragraphes"
            widget: "list"
            field: { label: "Paragraphe", name: "paragraphe", widget: "text" }

  # ─── RECHERCHE ─────────────────────────────────────────────────

  - name: "bandeau-recherche"
    label: "Recherche — Bandeau défilant (wip)"
    files:
      - name: "messages"
        label: "Messages du bandeau"
        file: "data/recherche-bandeau.json"
        fields:
          - label: "Messages"
            name: "items"
            widget: "list"
            fields:
              - { label: "Texte", name: "texte", widget: "string" }
              - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false }

  - name: "parcours"
    label: "Recherche — Parcours (wip)"
    files:
      - name: "diplomes"
        label: "Diplômes"
        file: "data/recherche-diplomes.json"
        fields:
          - label: "Diplômes"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Intitulé", name: "intitule", widget: "string" }
      - name: "distinctions"
        label: "Distinctions"
        file: "data/recherche-distinctions.json"
        fields:
          - label: "Distinctions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Intitulé", name: "intitule", widget: "string" }
      - name: "experience"
        label: "Expérience professionnelle"
        file: "data/recherche-experience.json"
        fields:
          - label: "Postes"
            name: "items"
            widget: "list"
            fields:
              - { label: "Période", name: "annee", widget: "string" }
              - { label: "Intitulé", name: "intitule", widget: "string" }
              - { label: "Établissement", name: "etablissement", widget: "string" }

  - name: "publications"
    label: "Recherche — Publications (wip)"
    files:
      - name: "ouvrages"
        label: "Ouvrages"
        file: "data/recherche-ouvrages.json"
        fields:
          - label: "Ouvrages"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lien", name: "url", widget: "string", required: false }
              - { label: "Éditeur / Collection", name: "meta", widget: "string", required: false }
      - name: "articles"
        label: "Articles"
        file: "data/recherche-articles.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lien", name: "url", widget: "string", required: false }
              - { label: "Revue / Ouvrage", name: "revue", widget: "string", required: false }
              - { label: "Éditeur", name: "editeur", widget: "string", required: false }
      - name: "entretiens"
        label: "Entretiens"
        file: "data/recherche-entretiens.json"
        fields:
          - label: "Entretiens"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lien", name: "url", widget: "string", required: false }
              - { label: "Publication", name: "meta", widget: "string", required: false }
      - name: "catalogues"
        label: "Catalogues d'exposition"
        file: "data/recherche-catalogues.json"
        fields:
          - label: "Catalogues"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lien", name: "url", widget: "string", required: false }
              - { label: "Exposition / Lieu", name: "meta", widget: "string", required: false }

  - name: "communications"
    label: "Recherche — Communications(wip)"
    files:
      - name: "liste"
        label: "Liste des communications"
        file: "data/recherche-communications.json"
        fields:
          - label: "Communications"
            name: "items"
            widget: "list"
            fields:
              - { label: "Année", name: "annee", widget: "string" }
              - { label: "Titre / Description", name: "texte", widget: "text" }
              - { label: "Lien", name: "url", widget: "string", required: false }

  - name: "apropos-recherche"
    label: "Recherche — À propos(wip)"
    files:
      - name: "recherche"
        label: "À propos — Recherche"
        file: "data/recherche-apropos.json"
        fields:
          - { label: "Portrait", name: "portrait", widget: "image" }
          - label: "Paragraphes"
            name: "paragraphes"
            widget: "list"
            field: { label: "Paragraphe", name: "paragraphe", widget: "text" }
