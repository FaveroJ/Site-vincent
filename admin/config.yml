backend:
  name: git-gateway
  branch: cms-integration

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: "bandeau"
    label: "Bandeau défilant"
    files:
      - name: "messages"
        label: "Messages du bandeau"
        file: "data/artiste-bandeau.json"
        fields:
          - label: "Messages"
            name: "items"
            widget: "list"
            fields:
              - { label: "Texte", name: "texte", widget: "string" }
              - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false }

   - name: "expositions"
    label: "Expositions"
    media_folder: assets/images/affiches
    public_folder: assets/images/affiches
    files:
      - name: "liste"
        label: "Liste des expositions"
        file: "data/artiste-expositions.json"
        fields:
          - label: "Expositions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lieu", name: "lieu", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Affiche (optionnel)", name: "affiche", widget: "image", required: false }

 - name: "dessins"
    label: "Galeries de dessins"
    media_folder: assets/images/dessins
    public_folder: assets/images/dessins
    files:
      - name: "liste"
        label: "Liste des galeries"
        file: "data/artiste-dessins.json"
        fields:
          - label: "Galeries"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Technique", name: "technique", widget: "string", required: false }
              - { label: "Support", name: "support", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Vignette (image principale)", name: "vignette", widget: "image" }
