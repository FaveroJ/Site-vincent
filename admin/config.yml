backend:
  name: git-gateway
  branch: cms-integration

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: "bandeau"
    label: "Bandeau défilant"
    files:
      - name: "messages"
        label: "Messages du bandeau"
        file: "data/artiste-bandeau.json"
        fields:
          - label: "Messages"
            name: "items"
            widget: "list"
            fields:
              - { label: "Texte", name: "texte", widget: "string" }
              - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false }

  - name: "expositions"
    label: "Expositions"
    files:
      - name: "liste"
        label: "Liste des expositions"
        file: "data/artiste-expositions.json"
        fields:
          - label: "Expositions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lieu", name: "lieu", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Affiche (optionnel)", name: "affiche", widget: "image", required: false }

  - name: "dessins"
    label: "Galeries de dessins"
    files:
      - name: "liste"
        label: "Liste des galeries"
        file: "data/artiste-dessins.json"
        fields:
          - label: "Galeries"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Technique", name: "technique", widget: "string", required: false }
              - { label: "Support", name: "support", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Vignette (image principale)", name: "vignette", widget: "image" }
  - name: "sons"
    label: "Sons"
    files:
      - name: "liste"
        label: "Liste des sons"
        file: "data/artiste-sons.json"
        fields:
          - label: "Sons"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "URL SoundCloud", name: "url", widget: "string" }
  - name: "installations"
    label: "Installations"
    files:
      - name: "liste"
        label: "Liste des installations"
        file: "data/artiste-installations.json"
        fields:
          - label: "Installations"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Lieu / Date", name: "meta", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image", required: false }
  - name: "livres"
    label: "Livres d'artiste"
    files:
      - name: "liste"
        label: "Liste des livres"
        file: "data/artiste-livres.json"
        fields:
          - label: "Livres"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Format", name: "format", widget: "string", required: false }
              - { label: "Technique", name: "technique", widget: "string", required: false }
              - { label: "Dimensions", name: "dimensions", widget: "string", required: false }
              - { label: "Année", name: "annee", widget: "string", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Vignette", name: "vignette", widget: "image" }
  - name: "apropos"
    label: "À propos"
    files:
      - name: "artiste"
        label: "À propos — Artiste"
        file: "data/artiste-apropos.json"
        fields:
          - { label: "Portrait", name: "portrait", widget: "image" }
          - label: "Paragraphes"
            name: "paragraphes"
            widget: "list"
            field: { label: "Paragraphe", name: "paragraphe", widget: "text" }
